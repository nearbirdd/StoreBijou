<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
    <title>Moon River</title>
</head>
<body>
    <header>
        <div class="headerStore">
            <div class="headerContent">
                <a href="index.html"><img src="images/Group 1 1.svg" alt="Логотип магазина в шапке" class="logo"></a>
                <div class="iconsHeader">
                    <box-icon name='heart' color='#c9c9c9' ></box-icon>
                    <box-icon name='user' color='#c9c9c9' ></box-icon>
                    <box-icon name='lock-alt' color='#c9c9c9' ></box-icon>
                </div>
                <div class="burger">
                    <span></span>
                </div>
            </div>
        </div>
        <section class="mainSection">
            <div class="ringMainSection">
                <a class="heroLink" href="index.html">Смотреть коллекцию</a>
                <img class="ringCartierMain" src="images/hero@1.png" alt="Кольцо Cartier">
            </div>
            <div class="discriptionMainSection">
                <div class="lang">
                    <button class="btnLangRU">RU</button>
                    <button class="btnLangEN">EN</button>
                </div>
                <div class="discRingMain">
                    <a class="mainRingTrinity" href="">КОЛЬЦО TRINITY, CARTIER</a>
                    <a class="compoundRingTrinity" href="">Белое золото, бриллианты</a>
                    <a class="costRingTrinity" href="">498 000 ₽</a>
                </div>
            </div>
        </section>
    </header>
    <section class="firstSection">
        <div class="genderSection">
            <a href="index.html">
                <img src="images/Man's-Section.jpg" alt="Мужской раздел">
            </a>
            <a class="manSection" href="index.html">
                <h3 class="selectChapter">Перейти в раздел</h3>
                <h3>Для мужчин</h3>
            </a>
            <a href="index.html">
                <img src="images/Woman-Section.jpg" alt="Женский раздел">
            </a>
            <a class="womanSection" href="index.html">
                <h3 class="selectChapter">Перейти в раздел</h3>
                <h3>Для женщин</h3>
            </a>
        </div>
    </section>
    <section class="mapSection">
        <div class="descriptionMapSection">
            <p>Найди</p>
            <p>бутик около себя</p>
            <span>Введите свой адрес и узнайте о самых ближайших бутиках к вам</span>
            <div class="inputFieldMap">
                <input type="text" placeholder="Введите адрес">
                <box-icon name='arrow-back' rotate='180' color='#ffffff' ></box-icon>
            </div>
        </div>
        <div id="map" class="map">
            <script src="https://api-maps.yandex.ru/2.1/?apikey=ваш API-ключ&lang=ru_RU"></script>
        </div>
    </section>
    <script src="js/script.js"></script>
</body>
</html>
